spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8082
          predicates:
            - Path=/auth/**
        - id: task-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/tasks/**, /v3/api-docs/**, /swagger-ui/**
    discovery:
      enabled: false

server:
  port: 8080

logging:
  level:
    org.springframework.cloud.gateway: DEBUG

app:
  security:
    user:
      name: user
      password: password
      roles: USER

jwt:
  secret: ${JWT_SECRET}